<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JKS SMS Jastrzębie — tabele ligowe i wyniki</title>
  <meta name="description" content="Tabele ligowe i wyniki meczów wszystkich drużyn JKS SMS Jastrzębie: seniorki, juniorki, juniorki młodsze i młodziczki. Dane na żywo z systemu SZPS.">
  <meta name="theme-color" content="#0F1210">
  <script>
    // choose the theme before the page paints:
    //   1. the visitor's saved choice, otherwise
    //   2. on a phone: the phone's setting, otherwise
    //   3. (computer) dark
    (function () {
      var t = null;
      try { t = localStorage.getItem("jks-theme"); } catch (e) {}
      // phone = touch screen with a small physical screen (tablets and desktops keep the dark default)
      var phone = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600;
      window.__jksPhone = phone;
      if (t !== "light" && t !== "dark") {
        t = phone && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === "light" ? "#FFFDF5" : "#0F1210";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&family=Monoton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="league.css?v=33">
</head>
<body>

  <!-- JKS in thin outline (Monoton, same face as the ZSMS JKS logo) running from the bottom-left to the top-right corner -->
  <div class="bg-fixed" aria-hidden="true">
    <div class="bg-j"></div>
  </div>

  <header class="top" id="top-bar">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu"><span></span></button>
    <button class="theme-toggle" type="button" aria-label="Przełącz motyw" title="Przełącz motyw jasny / ciemny">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></g></svg>
    </button>
    <nav id="site-nav" aria-label="Sekcje">
      <a class="brand" href="#top" aria-label="JKS SMS Jastrzębie, na górę"><span class="brand-mate" aria-hidden="true">ZSMS&nbsp;&nbsp;&nbsp;JKS</span></a>
      <!-- category links are added by the script from the API data -->
    </nav>
  </header>

  <main id="top">
    <p class="status" id="loading">Ładowanie danych…</p>
  </main>

  <footer>
    <span id="footer">Dane: system.szps.pl</span>
  </footer>

  <script>
    // Mobile menu (same behaviour as mate-web)
    (function () {
      var bar = document.getElementById('top-bar');
      var btn = bar.querySelector('.menu-toggle');
      // The bar's real height (closed) is exported as --bar-h; anchor jumps use it as scroll-padding-top,
      // so a section lands exactly under the bar and no edge of the previous card peeks out.
      // While the phone menu is open the bar is taller, so it is only measured when closed.
      function measureBar() {
        if (bar.classList.contains('open')) return;
        document.documentElement.style.setProperty('--bar-h', Math.round(bar.getBoundingClientRect().height) + 'px');
      }
      function set(open) {
        bar.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        measureBar();                       // runs before the browser performs the anchor jump
      }
      measureBar();
      window.addEventListener('resize', measureBar);
      if (window.ResizeObserver) new ResizeObserver(measureBar).observe(bar);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureBar);   // logo font changes the bar height
      btn.addEventListener('click', function () { set(!bar.classList.contains('open')); });
      bar.addEventListener('click', function (e) { if (e.target.closest('nav a')) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
      window.addEventListener('resize', function () { if (window.innerWidth > 820) set(false); });
    })();
  </script>

  <script>
    // Theme toggle: saves the choice. Without a saved choice a phone follows the phone's setting
    // (also when it changes at sunset), a computer stays dark.
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector(".theme-toggle");
      var meta = document.querySelector('meta[name="theme-color"]');
      function apply(t) {
        root.dataset.theme = t;
        if (meta) meta.content = t === "light" ? "#FFFDF5" : "#0F1210";
        btn.setAttribute("aria-label", t === "light" ? "Przełącz na motyw ciemny" : "Przełącz na motyw jasny");
      }
      apply(root.dataset.theme || "dark");
      btn.addEventListener("click", function () {
        var next = root.dataset.theme === "light" ? "dark" : "light";
        apply(next);
        try { localStorage.setItem("jks-theme", next); } catch (e) {}
      });
      var mq = matchMedia("(prefers-color-scheme: light)");
      var follow = function (e) {
        if (!window.__jksPhone) return;               // computers do not follow the system setting
        var saved = null;
        try { saved = localStorage.getItem("jks-theme"); } catch (err) {}
        if (!saved) apply(e.matches ? "light" : "dark");
      };
      if (mq.addEventListener) mq.addEventListener("change", follow);
    })();

    // Live data from the SZPS API.
    // Two cache levels:
    //   1. server: the Cloudflare function "api/..." keeps one shared copy for all visitors (10 min),
    //   2. browser: localStorage for CACHE_SECONDS.
    // Each data set has two URLs: our own endpoint first, then the SZPS API directly (used on hosting
    // without functions, e.g. GitHub Pages, or when our endpoint is down).
    // When both fail and an older saved copy exists, it is shown and marked as stale instead of an error.
    const CACHE_SECONDS = 600;    // 10 minutes
    const API_BASE = "https://system.szps.pl/webapi.php";
    const STANDINGS_URLS = ["api/standings", API_BASE + "?standings&club=9"];
    const MATCHES_URLS = ["api/matches", API_BASE + "?matches&club=9"];

    // localStorage can be blocked (private mode etc.): then we simply fetch every time
    function readCache(key) {
      try {
        const c = JSON.parse(localStorage.getItem(key));
        if (c && typeof c.time === "number" && c.data) return c;
      } catch (e) {}
      return null;
    }

    function writeCache(key, data, time) {
      try { localStorage.setItem(key, JSON.stringify({ time, data })); } catch (e) {}
    }

    // -> { time, data, stale }   stale = true when the API failed and an older saved copy is returned
    async function cachedFetch(urls, key, isValid) {
      const cached = readCache(key);
      const usable = cached && isValid(cached.data);
      if (usable && Date.now() - cached.time < CACHE_SECONDS * 1000) {
        return { time: cached.time, data: cached.data, stale: false };
      }
      let lastError = null;
      for (const url of urls) {                       // our endpoint first, then the SZPS API
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!isValid(data)) throw new Error("nieprawidłowa odpowiedź API");
          // our endpoint tells when its copy was made (X-Cached-At) and whether the API was down (X-Cache: STALE),
          // so the "pobrane" time and the stale banner stay truthful; the direct API sends neither header
          const cachedAt = Number(response.headers.get("X-Cached-At"));
          const time = cachedAt > 0 && cachedAt <= Date.now() ? cachedAt : Date.now();
          const serverStale = response.headers.get("X-Cache") === "STALE";
          writeCache(key, data, time);
          return { time, data, stale: serverStale };
        } catch (err) {
          lastError = err;
        }
      }
      if (usable) return { time: cached.time, data: cached.data, stale: true };
      throw lastError;
    }

    const getStandings = () => cachedFetch(STANDINGS_URLS, "jks-sms-standings", (d) => Array.isArray(d.tables));

    // Match results are fetched only when a team is expanded for the first time, then kept in memory
    let matchesPromise = null;
    function getMatches() {
      if (!matchesPromise) {
        matchesPromise = cachedFetch(MATCHES_URLS, "jks-sms-matches", (d) => Array.isArray(d.matches))
          .catch((e) => { matchesPromise = null; throw e; });
      }
      return matchesPromise;
    }

    const savedAt = (time) => new Date(time).toLocaleString("pl-PL");
    const staleNote = (time) =>
      el("p", "status stale", `API chwilowo niedostępne. Pokazuję zapisane dane z ${savedAt(time)}.`);

    // The API leaves double / trailing spaces in team names
    const clean = (name) => name.split(/\s+/).filter(Boolean).join(" ");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;   // textContent: no HTML injection from API data
      return node;
    }

    // "<b>3:1</b> (25:16, 25:20, 16:25, 25:21)" -> { sets: "3:1", parts: ["25:16", ...] } or null
    function parseScore(raw) {
      const m = /(\d+):(\d+)\s*(?:<\/b>)?\s*\(([^)]*)\)/.exec(raw || "");
      if (!m) return null;
      const parts = m[3].split(",").map((p) => p.trim()).filter((p) => p && p !== "0:0");
      return { home: +m[1], visitor: +m[2], parts };
    }

    const isUndated = (m) => !m.match_date || m.match_date <= "2000-01-01";

    function matchItem(m, team) {
      const home = clean(m.home), visitor = clean(m.visitor);
      const score = parseScore(m.score);
      const item = el("li", "match");
      const mine = home === team ? "home" : "visitor";
      if (score) item.classList.add(score[mine] > score[mine === "home" ? "visitor" : "home"] ? "win" : "loss");

      // the system uses 2000-01-01 as "no date set yet"
      const dateEl = el("span", "m-date");
      if (isUndated(m)) {
        dateEl.textContent = "termin do ustalenia";
        dateEl.classList.add("tbd");
      } else {
        const date = new Date(m.match_date + "T12:00:00");
        dateEl.textContent = date.toLocaleDateString("pl-PL", { day: "2-digit", month: "2-digit", year: "numeric" });
      }
      item.appendChild(dateEl);

      // home and away each on their own line (CSS puts them back inline on wide screens)
      const teams = el("span", "m-teams");
      teams.appendChild(el("span", home === team ? "us" : null, home));
      teams.appendChild(el("span", visitor === team ? "us" : null, visitor || "—"));
      item.appendChild(teams);

      const res = el("span", "m-score");
      if (score) {
        const won = item.classList.contains("win");
        const top = el("span", "m-top");
        // W / P letter: win and loss must not rely on colour alone
        const tag = el("span", "m-res", won ? "W" : "P");
        tag.title = won ? "Wygrana" : "Przegrana";
        top.appendChild(tag);
        top.appendChild(el("b", null, `${score.home}:${score.visitor}`));
        res.appendChild(top);
        if (score.parts.length) res.appendChild(el("small", null, score.parts.join(", ")));
      }
      item.appendChild(res);
      return item;
    }

    function renderMatches(box, data, table, team) {
      const all = data.matches
        .filter((m) => m.competition_name === table.competition && m.group_name === table.group_name &&
                       inActivePhase(m.phase) &&
                       (clean(m.home) === team || clean(m.visitor) === team))
        .sort((a, b) => a.match_date.localeCompare(b.match_date));
      const played = all.filter((m) => parseScore(m.score));
      const upcoming = all
        .filter((m) => !parseScore(m.score) && clean(m.visitor))
        .sort((a, b) => (isUndated(a) - isUndated(b)) || a.match_date.localeCompare(b.match_date));

      box.replaceChildren();
      if (!all.length) { box.appendChild(el("p", "status", "Brak meczów w systemie.")); return; }

      for (const [title, list] of [["Wyniki", played.reverse()], ["Najbliższe mecze", upcoming]]) {
        if (!list.length) continue;
        box.appendChild(el("h4", null, title));
        const ul = el("ul", "matches");
        for (const m of list) ul.appendChild(matchItem(m, team));
        box.appendChild(ul);
      }
    }

    // Our team's name becomes a button; clicking it opens a row with that team's matches
    function makeExpandable(row, team, table) {
      const cell = row.cells[1];
      const btn = el("button", "team-btn", team);
      btn.type = "button";
      btn.setAttribute("aria-expanded", "false");
      cell.replaceChildren(btn);

      let detail = null;
      btn.addEventListener("click", async () => {
        const open = btn.getAttribute("aria-expanded") !== "true";
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        row.classList.toggle("open", open);
        if (detail) detail.hidden = !open;
        if (!open || detail) return;

        detail = row.parentNode.insertRow(row.rowIndex);   // directly after the team row (thead is row 0)
        detail.className = "matches-row";   // not "detail": that name is styled by the old template
        const td = detail.insertCell();
        td.colSpan = row.cells.length;
        const box = el("div", "matches-box");
        box.appendChild(el("p", "status", "Ładowanie meczów…"));
        td.appendChild(box);
        try {
          const res = await getMatches();
          renderMatches(box, res.data, table, team);
          if (res.stale) box.prepend(staleNote(res.time));
        } catch (err) {
          box.replaceChildren(el("p", "status error", `Nie udało się pobrać meczów: ${err.message}`));
          detail.remove(); detail = null;
          btn.setAttribute("aria-expanded", "false");
          row.classList.remove("open");
        }
      });

      // the whole row is a click target, not only the name (the button stays for keyboard / screen readers)
      row.classList.add("club-row");
      row.addEventListener("click", (e) => {
        if (e.target.closest(".team-btn")) return;      // the button handles its own click
        btn.click();
      });
    }

    // "6", "11M" -> "Grupa 6", "Grupa 11M"; names like "1 Liga" or "Grupa 1 – I Liga" stay as they are
    const groupTitle = (name) => (/^\d+[A-Za-z]?$/.test(clean(name)) ? `Grupa ${clean(name)}` : clean(name));

    function renderTable(table, categoryTitle) {
      const clubTeams = table.club_teams.map((c) => clean(c.team));
      // collapsed by default: the header (with our teams' positions) is the toggle, the table opens below it
      const frag = el("details", "fold");
      const summary = el("summary");

      const header = el("header");
      header.appendChild(el("h3", null, `${categoryTitle} – ${groupTitle(table.group_name)}`));
      header.appendChild(el("p", "meta", `${table.competition} · drużyn: ${table.total_teams}`));
      const ours = table.club_teams
        .map((c) => `${clean(c.team)}: ${c.position}. miejsce, ${c.points} pkt`).join(" · ");
      if (ours) header.appendChild(el("p", "sum-ours", ours));
      summary.appendChild(header);
      frag.appendChild(summary);

      const wrap = el("div", "table-wrap");
      const tbl = el("table", "league");
      const thead = tbl.createTHead().insertRow();
      for (const label of ["Poz", "Drużyna", "M", "W", "Pkt", "Sety", "Małe pkt"]) {
        thead.appendChild(el("th", null, label));
      }

      const tbody = tbl.createTBody();
      for (const t of table.full_standings) {
        const name = clean(t.team);
        const row = tbody.insertRow();
        if (clubTeams.includes(name)) row.className = "me";
        const cells = [
          [t.position], [name], [t.matches_played], [t.wins], [t.points, "pts"],
          [`${t.sets_won}:${t.sets_lost}`], [`${t.points_scored}:${t.points_conceded}`],
        ];
        for (const [value, cls] of cells) {
          const td = row.insertCell();
          td.textContent = value;
          if (cls) td.className = cls;
        }
        if (clubTeams.includes(name)) makeExpandable(row, name, table);
      }
      wrap.appendChild(tbl);
      frag.appendChild(wrap);
      return frag;
    }

    function showStatus(card, message, isError) {
      card.replaceChildren(el("p", "status" + (isError ? " error" : ""), message));
    }

    // Only this stage (the API field "phase") is shown for now; set to null to show every stage
    const ACTIVE_PHASE = 1;
    const inActivePhase = (phase) => ACTIVE_PHASE === null || Number(phase) === ACTIVE_PHASE;

    // Display order and names of the categories; anything unknown is appended in API order
    const CATEGORY_ORDER = ["I Liga Śląska Kobiet", "Juniorki", "Juniorki Młodsze", "Młodziczki"];
    const CATEGORY_TITLE = { "I Liga Śląska Kobiet": "Seniorki" };
    const slug = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    function buildPage(data) {
      const main = document.querySelector("main");
      const nav = document.getElementById("site-nav");
      main.replaceChildren();

      // group tables by competition
      const byCompetition = new Map();
      for (const t of data.tables) {
        if (!inActivePhase(t.phase)) continue;
        if (!byCompetition.has(t.competition)) byCompetition.set(t.competition, []);
        byCompetition.get(t.competition).push(t);
      }
      const rank = (c) => { const i = CATEGORY_ORDER.indexOf(c); return i < 0 ? 99 : i; };
      const competitions = [...byCompetition.keys()].sort((a, b) => rank(a) - rank(b));

      for (const competition of competitions) {
        const title = CATEGORY_TITLE[competition] || competition;
        const id = slug(title);

        const link = el("a", null, title);
        link.href = "#" + id;
        nav.appendChild(link);

        const section = el("section", "section");
        section.id = id;

        const tables = byCompetition.get(competition)
          .sort((a, b) => clean(a.group_name).localeCompare(clean(b.group_name), "pl", { numeric: true }));
        for (const table of tables) {
          const card = el("article", "job current");
          card.appendChild(renderTable(table, title));
          section.appendChild(card);
        }
        main.appendChild(section);
      }
    }

    async function load() {
      try {
        const { data, time, stale } = await getStandings();
        buildPage(data);
        if (stale) document.querySelector("main").prepend(staleNote(time));
        document.getElementById("footer").textContent = stale
          ? `Dane: system.szps.pl · zapisane ${savedAt(time)} (API niedostępne)`
          : `Dane: system.szps.pl · pobrane ${savedAt(time)}`;
      } catch (err) {
        document.querySelector("main").replaceChildren(
          el("p", "status error", `Nie udało się pobrać danych z API: ${err.message}`));
      }
    }

    load();
  </script>

</body>
</html>
