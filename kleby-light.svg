<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#0A9460" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0A9460" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#E0A100" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E0A100" stop-opacity="0"/>
    </radialGradient>
    <!-- noise displaces the puffs, a wide blur turns them into soft smoke -->
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.007" numOctaves="3" seed="13" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="120" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="15"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#FFFDF5"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#warm)"/>
  <g filter="url(#smoke)">
    <circle cx="120" cy="163" r="44" fill="#2CC98E" fill-opacity="0.38"/>
    <circle cx="1142" cy="429" r="79" fill="#0A9460" fill-opacity="0.47"/>
    <circle cx="213" cy="247" r="98" fill="#0A9460" fill-opacity="0.44"/>
    <circle cx="443" cy="423" r="46" fill="#0A9460" fill-opacity="0.49"/>
    <circle cx="582" cy="525" r="104" fill="#0A9460" fill-opacity="0.59"/>
    <circle cx="413" cy="723" r="61" fill="#0A9460" fill-opacity="0.51"/>
    <circle cx="504" cy="200" r="49" fill="#0A9460" fill-opacity="0.65"/>
    <circle cx="971" cy="170" r="45" fill="#E0A100" fill-opacity="0.65"/>
    <circle cx="1448" cy="826" r="110" fill="#0A9460" fill-opacity="0.36"/>
    <circle cx="911" cy="164" r="47" fill="#0A9460" fill-opacity="0.47"/>
    <circle cx="299" cy="794" r="121" fill="#0A9460" fill-opacity="0.63"/>
    <circle cx="572" cy="852" r="56" fill="#0A9460" fill-opacity="0.47"/>
    <circle cx="443" cy="150" r="52" fill="#2CC98E" fill-opacity="0.65"/>
    <circle cx="1414" cy="226" r="105" fill="#2CC98E" fill-opacity="0.51"/>
    <circle cx="128" cy="180" r="59" fill="#0A9460" fill-opacity="0.36"/>
    <circle cx="1093" cy="553" r="76" fill="#0A9460" fill-opacity="0.34"/>
    <circle cx="967" cy="122" r="51" fill="#2CC98E" fill-opacity="0.66"/>
    <circle cx="169" cy="850" r="112" fill="#E0A100" fill-opacity="0.30"/>
    <circle cx="1297" cy="489" r="113" fill="#0A9460" fill-opacity="0.57"/>
    <circle cx="1164" cy="363" r="106" fill="#0A9460" fill-opacity="0.40"/>
  </g>
</svg>
