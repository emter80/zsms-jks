<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#12C98C" stop-opacity=".20"/>
      <stop offset="1" stop-color="#12C98C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#F2C25C" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F2C25C" stop-opacity="0"/>
    </radialGradient>
    <!-- noise displaces the puffs, a wide blur turns them into soft smoke -->
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.007" numOctaves="3" seed="13" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="120" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="17"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0F1210"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#warm)"/>
  <g filter="url(#smoke)">
    <circle cx="120" cy="163" r="44" fill="#4FF0B5" fill-opacity="0.35"/>
    <circle cx="1142" cy="429" r="79" fill="#12C98C" fill-opacity="0.44"/>
    <circle cx="213" cy="247" r="98" fill="#12C98C" fill-opacity="0.40"/>
    <circle cx="443" cy="423" r="46" fill="#12C98C" fill-opacity="0.46"/>
    <circle cx="582" cy="525" r="104" fill="#12C98C" fill-opacity="0.54"/>
    <circle cx="413" cy="723" r="61" fill="#12C98C" fill-opacity="0.47"/>
    <circle cx="504" cy="200" r="49" fill="#12C98C" fill-opacity="0.60"/>
    <circle cx="971" cy="170" r="45" fill="#F2C25C" fill-opacity="0.60"/>
    <circle cx="1448" cy="826" r="110" fill="#12C98C" fill-opacity="0.33"/>
    <circle cx="911" cy="164" r="47" fill="#12C98C" fill-opacity="0.44"/>
    <circle cx="299" cy="794" r="121" fill="#12C98C" fill-opacity="0.58"/>
    <circle cx="572" cy="852" r="56" fill="#12C98C" fill-opacity="0.44"/>
    <circle cx="443" cy="150" r="52" fill="#4FF0B5" fill-opacity="0.60"/>
    <circle cx="1414" cy="226" r="105" fill="#4FF0B5" fill-opacity="0.47"/>
    <circle cx="128" cy="180" r="59" fill="#12C98C" fill-opacity="0.33"/>
    <circle cx="1093" cy="553" r="76" fill="#12C98C" fill-opacity="0.32"/>
    <circle cx="967" cy="122" r="51" fill="#4FF0B5" fill-opacity="0.61"/>
    <circle cx="169" cy="850" r="112" fill="#F2C25C" fill-opacity="0.28"/>
    <circle cx="1297" cy="489" r="113" fill="#12C98C" fill-opacity="0.53"/>
    <circle cx="1164" cy="363" r="106" fill="#12C98C" fill-opacity="0.37"/>
  </g>
</svg>
