<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.9">
      <stop offset="0" stop-color="#10B981" stop-opacity=".10"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <!-- noise displaces the puffs, a wide blur turns them into soft smoke -->
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.007" numOctaves="3" seed="13" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="110" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#0F1210"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <g filter="url(#smoke)">
    <circle cx="120" cy="163" r="44" fill="#6EE7B7" fill-opacity="0.20"/>
    <circle cx="1142" cy="429" r="79" fill="#10B981" fill-opacity="0.25"/>
    <circle cx="213" cy="247" r="98" fill="#10B981" fill-opacity="0.23"/>
    <circle cx="443" cy="423" r="46" fill="#10B981" fill-opacity="0.26"/>
    <circle cx="582" cy="525" r="104" fill="#10B981" fill-opacity="0.31"/>
    <circle cx="413" cy="723" r="61" fill="#10B981" fill-opacity="0.27"/>
    <circle cx="504" cy="200" r="49" fill="#10B981" fill-opacity="0.34"/>
    <circle cx="971" cy="170" r="45" fill="#E6B75A" fill-opacity="0.34"/>
    <circle cx="1448" cy="826" r="110" fill="#10B981" fill-opacity="0.19"/>
    <circle cx="911" cy="164" r="47" fill="#10B981" fill-opacity="0.25"/>
    <circle cx="299" cy="794" r="121" fill="#10B981" fill-opacity="0.33"/>
    <circle cx="572" cy="852" r="56" fill="#10B981" fill-opacity="0.25"/>
    <circle cx="443" cy="150" r="52" fill="#6EE7B7" fill-opacity="0.34"/>
    <circle cx="1414" cy="226" r="105" fill="#6EE7B7" fill-opacity="0.27"/>
    <circle cx="128" cy="180" r="59" fill="#10B981" fill-opacity="0.19"/>
    <circle cx="1093" cy="553" r="76" fill="#10B981" fill-opacity="0.18"/>
    <circle cx="967" cy="122" r="51" fill="#6EE7B7" fill-opacity="0.35"/>
    <circle cx="169" cy="850" r="112" fill="#E6B75A" fill-opacity="0.16"/>
